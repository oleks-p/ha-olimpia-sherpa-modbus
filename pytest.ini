[pytest]
testpaths = tests
# tools/ holds standalone scripts; the probe and the simulator are imported as
# top-level modules.
pythonpath = . tools
# Needed by the Home Assistant test harness (its autouse fixtures are async).
# Plain pytest, as in the Python 3.11 probe job, does not know these options and
# ignores them.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore:Unknown config option:pytest.PytestConfigWarning
